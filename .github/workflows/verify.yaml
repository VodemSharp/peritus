name: Verify

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      REGISTRY_ENDPOINT: ghcr.io
      REGISTRY_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version 13.0.0
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Restore and Build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Smoke test: verify the AppHost can generate Docker Compose artifacts.
      # The output is uploaded as a PR artifact so reviewers can inspect it.
      - name: Verify AppHost generates compose
        env:
          APP_VERSION: ${{ github.event.pull_request.number && format('pr-{0}-{1}', github.event.pull_request.number, github.run_id) || format('manual-{0}', github.run_id) }}
          OUTPUT_DIR: artifacts/compose-verify
          APPHOST_PROJECT_PATH: src/host/Peritus.AppHost/Peritus.AppHost.csproj
        run: bash .github/scripts/publish-docker-compose.sh

      - name: Upload compose artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-verify
          path: artifacts/compose-verify/
