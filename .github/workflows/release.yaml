# TODO: Add Slack/Teams/Discord notification on failure
# See: https://github.com/slackapi/slack-github-action

name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY_ENDPOINT: ghcr.io
      REGISTRY_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version ${{ vars.ASPIRE_VERSION }}
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Determine promotion strategy
        id: promote_check
        run: bash .github/scripts/check-release-promotion.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote dev images to prod
        id: promote
        if: ${{ steps.promote_check.outputs.safe == 'true' }}
        env:
          SOURCE_TAG: ${{ steps.promote_check.outputs.promote_sha }}
          TARGET_TAGS: latest,${{ steps.version.outputs.version }}
        run: bash .github/scripts/tag-and-push-container-images.sh

      - name: Build and push images (fallback)
        if: ${{ steps.promote_check.outputs.safe != 'true' }}
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: aspire do push

      # NOTE: This step relies on the version-tagged image having been pushed
      # in the preceding promotion or fallback build step. If that step failed
      # partially, this migration will fail with a Docker "not found" error.
      - name: Run database migrations
        env:
          CONNECTION_STRING: ${{ secrets.PROD_DATABASE_CONNECTION_STRING }}
        run: |
          docker run --rm \
            -e "ConnectionStrings__db=${CONNECTION_STRING}" \
            "ghcr.io/${{ github.repository }}/migrator:${{ steps.version.outputs.version }}"

      - name: Generate compose artifacts
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APPHOST_PROJECT_PATH: src/host/Peritus.AppHost/Peritus.AppHost.csproj
        run: bash .github/scripts/publish-docker-compose.sh

      - name: Upload compose artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-prod
          path: artifacts/compose/

      - name: Trigger Dokploy prod redeploy
        run: |
          if [ -z "${{ secrets.PROD_DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "Error: PROD_DOKPLOY_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          curl -X POST "${{ secrets.PROD_DOKPLOY_WEBHOOK_URL }}" \
               -H "Content-Type: application/json" \
               -d '{}' \
               --fail-with-body
