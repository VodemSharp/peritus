# TODO: Add Slack/Teams/Discord notification on failure
# See: https://github.com/slackapi/slack-github-action

name: Stage

on:
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    env:
      REGISTRY_ENDPOINT: ghcr.io
      REGISTRY_REPOSITORY: ${{ github.repository }}
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version ${{ vars.ASPIRE_VERSION }}
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Restore and Build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: aspire do push

      - name: Ensure jq is installed
        run: |
          if command -v jq &> /dev/null; then
            echo "jq already installed: $(jq --version)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Cleanup old images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_OWNER_TYPE: ${{ github.event.organization && 'org' || 'user' }}
        run: |
          bash .github/scripts/delete-old-container-images.sh api 20
          bash .github/scripts/delete-old-container-images.sh migrator 20
          bash .github/scripts/delete-old-container-images.sh web 20

      - name: Run database migrations
        env:
          CONNECTION_STRING: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
        run: |
          docker run --rm \
            -e "ConnectionStrings__db=${CONNECTION_STRING}" \
            "ghcr.io/${{ github.repository }}/migrator:${{ github.sha }}"

      - name: Generate compose artifacts
        env:
          APP_VERSION: ${{ github.sha }}
          APPHOST_PROJECT_PATH: src/host/Peritus.AppHost/Peritus.AppHost.csproj
        run: bash .github/scripts/publish-docker-compose.sh

      - name: Upload compose artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-dev
          path: artifacts/compose/

      - name: Tag candidate
        run: |
          git tag -f candidate "${{ github.sha }}"
          git push -f origin candidate

      - name: Trigger Dokploy dev redeploy
        run: |
          if [ -z "${{ secrets.DEV_DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "Error: DEV_DOKPLOY_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          curl -X POST "${{ secrets.DEV_DOKPLOY_WEBHOOK_URL }}" \
               -H "Content-Type: application/json" \
               -d '{}' \
               --fail-with-body
