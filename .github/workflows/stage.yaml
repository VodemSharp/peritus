# TODO: Add Slack/Teams/Discord notification on failure
# See: https://github.com/slackapi/slack-github-action

name: Stage

on:
  push:
    branches: [ dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    runs-on: self-hosted
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    env:
      REGISTRY_ENDPOINT: ghcr.io
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Add .NET to PATH
        run: echo "${{ github.workspace }}/.dotnet" >> $GITHUB_PATH

      - name: Set lowercase registry repository
        run: |
          echo "REGISTRY_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_PREFIX=$(echo '${{ github.repository }}' | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Aspire CLI
        run: |
          curl -sSL https://aspire.dev/install.sh | bash -s -- --version ${{ vars.ASPIRE_VERSION }}
          echo "$HOME/.aspire/bin" >> $GITHUB_PATH

      - name: Restore and Build
        run: |
          dotnet restore backend/Epsy.slnx
          dotnet build backend/Epsy.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/Epsy.slnx --no-build --configuration Release

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: aspire do push

      - name: Tag staging image for Dokploy
        env:
          SOURCE_TAG: ${{ github.sha }}
          TARGET_TAGS: staging
          IMAGES: api
        run: dotnet run .github/scripts/tag-and-push-container-images.cs

      - name: Cleanup old images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_OWNER_TYPE: ${{ github.event.organization && 'org' || 'user' }}
        run: |
          dotnet run .github/scripts/delete-old-container-images.cs -- "${IMAGE_PREFIX}/api" 20
          dotnet run .github/scripts/delete-old-container-images.cs -- "${IMAGE_PREFIX}/migrator" 20

      - name: Run database migrations
        env:
          CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          ADMIN_EMAIL: ${{ secrets.MIGRATOR_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.MIGRATOR_ADMIN_PASSWORD }}
        run: |
          docker run --rm \
            -e "ConnectionStrings__db=${CONNECTION_STRING}" \
            -e "IdentitySeedOptions__AdminEmail=${ADMIN_EMAIL}" \
            -e "IdentitySeedOptions__AdminPassword=${ADMIN_PASSWORD}" \
            "ghcr.io/${REGISTRY_REPOSITORY}/migrator:${{ github.sha }}"

      - name: Generate compose artifacts
        env:
          APP_VERSION: ${{ github.sha }}
          APPHOST_PROJECT_PATH: backend/src/Epsy.AppHost/Epsy.AppHost.csproj
        run: dotnet run .github/scripts/publish-docker-compose.cs

      - name: Upload compose artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-dev
          path: artifacts/compose/

      - name: Tag candidate
        run: |
          git tag -f candidate "${{ github.sha }}"
          git push -f origin candidate

      - name: Trigger Dokploy dev redeploy
        run: |
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "Error: DOKPLOY_WEBHOOK_URL is not configured" >&2
            exit 1
          fi
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
               -H "Content-Type: application/json" \
               -d '{}' \
               --fail-with-body
